name: Release and deploy

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run check

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump to the next unused patch version
        id: bump
        run: |
          git fetch --tags origin
          NEXT_VERSION=$(node --input-type=module - <<'EOF'
          import { execFileSync } from 'node:child_process';
          import pkg from './package.json' with { type: 'json' };

          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
          if (!match) {
            throw new Error(`Expected x.y.z version, got ${pkg.version}`);
          }

          const [, major, minor, currentPatch] = match;
          let patch = Number(currentPatch) + 1;

          while (
            execFileSync('git', ['tag', '--list', `v${major}.${minor}.${patch}`], {
              encoding: 'utf8'
            }).trim()
          ) {
            patch += 1;
          }

          process.stdout.write(`${major}.${minor}.${patch}`);
          EOF
          )

          echo "Releasing version $NEXT_VERSION"
          npm version "$NEXT_VERSION" -m 'chore: release v%s'
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes

      - name: Link Vercel project
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel deployment
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
